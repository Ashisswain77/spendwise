# =============================================================================
# SpendWise — Render Deployment Configuration
# =============================================================================
# This file configures the backend API service on Render.
# Environment variables must be set in the Render Dashboard — never here.
# =============================================================================

services:
  - type: web
    name: spendwise-api
    runtime: node
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # Set manually in Render Dashboard
      - key: DB_NAME
        value: spendwise
      - key: FRONTEND_URL
        sync: false  # Set to your Vercel production URL
      - key: CLERK_PUBLISHABLE_KEY
        sync: false  # Set manually in Render Dashboard
      - key: CLERK_SECRET_KEY
        sync: false  # Set manually in Render Dashboard
    healthCheckPath: /api/v1/health
    numInstances: 1

